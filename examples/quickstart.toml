# Proofload quickstart: the keyless mock agent over the tool-reliability preset shape.
# 3 tasks x 3 tool failure rates x 100 replicates = 900 rollouts. No API key, no network.
# N=100 clears the pre-flight power gate on its own: MDE 0.1932 at base rate 0.5,
# under the 0.20 default, so no --max-mde is needed to run it.
#
#   poisson-prove sweep examples/quickstart.toml --target poisson_prove.examples.mock_agent:rollout --yes
#   poisson-prove sweep examples/quickstart.toml --target poisson_prove.examples.mock_agent:rollout_patched --pair-with <run_a> --yes
#   poisson-prove report <run_a> <run_b> --event violated --x tool_fail_rate --y task_id

target_id = "mock-agent@v0"
t_unit = "tool_calls"
replicates = 100

[axes.task_id]
type = "categorical"
values = ["search", "checkout", "refund"]

[axes.tool_fail_rate]
type = "continuous"
values = [0.0, 0.3, 0.55]
