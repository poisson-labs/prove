[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poisson-prove"
version = "0.0.1"
description = "A statistical instrument for finding where autonomous and agentic systems break."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy", "pandas>=2", "scipy", "pyarrow"]

[project.optional-dependencies]
modal = ["modal"]
agent = ["litellm", "openai>=2.20,<3", "opentelemetry-sdk"]
viz = ["matplotlib"]
all = ["modal", "litellm", "openai>=2.20,<3", "matplotlib", "opentelemetry-sdk"]
dev = ["cloudpickle", "pytest", "hypothesis", "mypy", "ruff", "lifelines", "statsmodels", "packaging", "opentelemetry-exporter-otlp-proto-common", "pyyaml"]

[project.scripts]
poisson-prove = "poisson_prove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poisson_prove"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*", "modal", "modal.*", "burla", "burla.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "calibration: a rejection rate over sharp-null resamples (S25 section A, the slow lane); deselected only by typing -m \"not calibration\", never by configuration",
    "slow: over 10 s of setup and call on the runner, such as a wheel built and installed into a fresh environment; runs on main and nightly, never on a pull request",
]
