[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poisson-prove"
version = "0.0.1"
description = "Did your change to the agent really change how often it fails? Replays the same cases before and after, and says per condition, with stated error bounds and detection limits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
maintainers = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
keywords = ["agents", "llm", "evaluation", "statistics", "reliability", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyarrow>=12.0.0",
    "rich>=14.2.0",
    "textual>=6.4.0",
    "threadpoolctl>=3.0.0",
]

[project.urls]
Homepage = "https://poissonlabs.ai/tools/prove"
Source = "https://github.com/poisson-labs/prove"
Documentation = "https://github.com/poisson-labs/prove/tree/main/docs"
Changelog = "https://github.com/poisson-labs/prove/blob/main/CHANGELOG.md"
Issues = "https://github.com/poisson-labs/prove/issues"

[project.optional-dependencies]
modal = ["modal>=0.73.76"]
burla = ["burla==1.8.2"]
agent = ["openai>=2.20,<3", "opentelemetry-sdk>=1.41.0"]
all = ["modal>=0.73.76", "burla==1.8.2", "openai>=2.20,<3", "opentelemetry-sdk>=1.41.0"]
dev = [
    "cloudpickle>=3.1.1",
    "hatchling>=1.27.0",
    "hypothesis>=6.70.0",
    "jsonschema>=4.18.0",
    "lifelines>=0.27.8",
    "markdown-it-py>=2.2.0",
    "mypy>=2.2.0",
    "opentelemetry-exporter-otlp-proto-common>=1.41.0",
    "packaging>=25.0",
    "playwright>=1.40.0",
    "pyte>=0.8.1",
    "pytest>=7.4.0",
    "pytest-xdist>=3.5.0",
    "pyyaml>=6.0.1",
    "ruff>=0.1.0",
    "statsmodels>=0.14.0",
]

[project.scripts]
poisson-prove = "poisson_prove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poisson_prove"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    ".gitignore",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*", "modal", "modal.*", "burla", "burla.*", "threadpoolctl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "math: the math suite, the statistics (stats, survival, diff's tests and limits, tree's omnibus and bound, paired's analysis, the simulation checks of the detection limits, calibration); runs on a pull request that changes the statistics code (src/poisson_prove/stats.py, survival.py, diff.py, tree.py, paired.py, _limits.py, _verdict.py), a test of the math suite, or the resolved numpy, scipy, pandas, lifelines or statsmodels, nightly and before every release",
    "calibration: a rejection rate over sharp-null resamples (the slow lane); deselected only by typing -m \"not calibration\", never by configuration",
    "slow: over 10 s of setup and call on the runner, such as a wheel built and installed into a fresh environment; runs on main and nightly, never on a pull request",
    "backend: calls a real Modal or Burla account (a paid call, needs the user's own credentials); run by hand only, never on a pull request and never in CI; each such test is also skipped unless its opt-in variable is set",
]
