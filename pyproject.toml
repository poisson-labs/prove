[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poisson-prove"
version = "0.0.1"
description = "A statistical instrument for finding where autonomous and agentic systems break."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy", "pandas>=2", "scipy", "pyarrow", "rich>=14.2.0", "textual>=6.4.0"]

[project.optional-dependencies]
modal = ["modal>=0.73.76"]
burla = ["burla==1.8.2"]
agent = ["litellm", "openai>=2.20,<3", "opentelemetry-sdk"]
viz = ["matplotlib"]
all = ["modal>=0.73.76", "burla==1.8.2", "litellm", "openai>=2.20,<3", "matplotlib", "opentelemetry-sdk"]
dev = ["cloudpickle", "pytest", "hypothesis", "mypy", "ruff", "lifelines", "statsmodels", "packaging", "opentelemetry-exporter-otlp-proto-common", "jsonschema", "playwright", "pyte"]

[project.scripts]
poisson-prove = "poisson_prove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poisson_prove"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*", "modal", "modal.*", "burla", "burla.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "math: the math suite, the statistics (stats, survival, diff's tests and limits, tree's omnibus and bound, the simulation checks of the detection limits, calibration); runs on a pull request that changes the statistics code (stats.py, survival.py, diff.py, tree.py and the modules they call for their numbers) or the resolved numpy, scipy, pandas, lifelines or statsmodels, nightly and before every release",
    "calibration: a rejection rate over sharp-null resamples (S25 section A, the slow lane); deselected only by typing -m \"not calibration\", never by configuration",
    "slow: over 10 s of setup and call on the runner, such as a wheel built and installed into a fresh environment; runs on main and nightly, never on a pull request",
    "backend: calls a real Modal or Burla account (a paid call, needs the user's own credentials); run by hand only, never on a pull request and never in CI; each such test is also skipped unless its opt-in variable is set",
]
