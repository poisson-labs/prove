# The gate: every pull request and every push to main. The check main's ruleset requires is the job
# `gate`, which always runs and passes only when every job below passed or was not called for.
#
# - changes: decides whether this change runs the math suite (math_lane.py) and the backend tests,
#   the Burla and Modal fakes (backends_lane.py). A change to the docs, the version or the CHANGELOG
#   runs neither.
# - lint: ruff, the format check on src, and mypy.
# - tests: the code suite on Linux and Python 3.11, the lowest Prove supports, cut into the shards
#   of SHARDS below, which run side by side. One worker per core in each.
# - math, backends: only when `changes` says so.
#
# Each lane runs pytest through .github/lanes/lane.py, which adds the lane's row (tests, wall time
# against its budget, the runner's load, and the tests over 10 seconds) to the job summary.
#
# The shard table (shards.py reads it): a number, a colon and the test files that shard runs,
# continued on indented lines. The shard that says `rest` runs every test file no other line
# names, so a new test file runs there with no change here. `backends` is the fakes' own job. To
# move a file, move its path between lines. The table was balanced from the per-file times of the
# code suite at four workers on 2026-10-31, then from the shards' own runs on a hosted runner,
# whose test reports each shard keeps for a week (artifact `junit-shard-N`); the target is under
# five minutes from the first job's start to the gate's end.
#
# Everything slow runs in nightly.yml, never here; the release runs from a tag in release.yml.
# Every job runs on a GitHub-hosted runner, reads no secret and holds only read access to the
# repository; every action is pinned to a full commit SHA.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.24"
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
  OPENBLAS_NUM_THREADS: "1"
  CODE_SUITE: not math and not calibration and not backend and not slow
  SHARDS: |
    1: tests/test_pf6_app.py
    2: tests/test_pf7_docs.py tests/test_pf0_name.py tests/test_m7_multi.py
    3: tests/test_s27_leaves.py tests/test_pf5_api_core.py tests/test_app_banner.py
       tests/test_m10_multi.py tests/test_m6_multi.py
    4: tests/test_s29_viewer.py tests/test_pf12_artifacts.py tests/test_ls_local_serve.py
       tests/test_fr_first_run.py
    5: tests/test_pf1_look.py tests/test_pf6_look.py tests/test_pf12_ui.py tests/test_p1_payload.py
    6: tests/test_s26_fault_lines.py tests/test_pf3_first_run.py tests/test_pf11_setup_agent.py
       tests/test_defaults_refusals_and_faces.py
    7: tests/test_s28_report.py tests/test_s23_power.py tests/test_pf8_public_hygiene.py
       tests/test_m13_viewer.py tests/test_capture_crash_and_timeout_behaviour.py
       tests/test_competing_set.py
    8: rest
    backends: tests/test_bu_burla_backend.py tests/test_m3_modal.py tests/test_m3_modal_launch.py
       tests/test_mc_modal_chaos.py tests/test_pf9_backends.py

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      math: ${{ steps.math.outputs.math }}
      backends: ${{ steps.backends.outputs.backends }}
    env:
      # A pull request against its base; a push to main against main before the push.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: python -m pip install --quiet "uv==$UV_VERSION"
      - id: math
        name: Does this change run the math suite?
        run: python .github/lanes/math_lane.py "$BASE_SHA" "$HEAD_SHA"
      - id: backends
        name: Does this change run the backend tests?
        run: python .github/lanes/backends_lane.py "$BASE_SHA" "$HEAD_SHA"

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "3.11" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
      - name: Lint and types
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check src
          .venv/bin/mypy src

  tests:
    name: tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "3.11" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "WORKERS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"
      - name: Code suite, this shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          files=$(.venv/bin/python .github/lanes/shards.py "$SHARD" --total "$SHARD_COUNT")
          .venv/bin/python .github/lanes/lane.py "code-$SHARD" 300 --over 10 -q -p no:cacheprovider -n "$WORKERS" -m "$CODE_SUITE" $files
      - name: Keep the shard's test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-shard-${{ matrix.shard }}
          path: /tmp/lane-*/junit.xml
          retention-days: 7
          if-no-files-found: warn

  math:
    needs: [changes]
    if: needs.changes.outputs.math == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "3.11" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "WORKERS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"
      - name: Math suite
        run: .venv/bin/python .github/lanes/lane.py math 4200 -q -p no:cacheprovider -n "$WORKERS" -m "math or calibration" tests

  backends:
    needs: [changes]
    if: needs.changes.outputs.backends == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "3.11" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "WORKERS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"
      - name: Backend tests, the Burla and Modal fakes
        run: |
          files=$(.venv/bin/python .github/lanes/shards.py backends)
          .venv/bin/python .github/lanes/lane.py backends 600 -q -p no:cacheprovider -n "$WORKERS" -m "$CODE_SUITE" $files

  gate:
    needs: [changes, lint, tests, math, backends]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job passed, or was not called for
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/lanes/gate.py
