# Every job runs on a GitHub-hosted runner, which costs nothing on a public repository. No job
# uses a self-hosted runner (a fork's pull request could run code on it), reads a secret, or holds
# more than read access to the repository. Every action is pinned to a full commit SHA.
#
# The lanes (CONTRIBUTING.md, "Running the tests"):
# - code: the code suite, ruff, the format check and mypy, on every pull request (Linux, Python
#   3.11) and every push to main (Linux and macOS, 3.11 and 3.14); all four Pythons on both
#   nightly and before a release. Budget: 5 minutes per Python on the maintainer's Mac.
# - math: the statistics, on a pull request that changes them (math_lane.py says why), nightly
#   and before a release.
# - slow: nightly and before a release. Tests marked backend never run in CI.
# - floors: the code suite with every requirement at its floor, nightly and before a release.
# - linux: the code suite in a Debian container, as a user that is not root, nightly and before a
#   release.
# - history: before a release, no commit names an assistant and every address is the work one.
#
# Each lane runs pytest through .github/lanes/lane.py, which adds the lane's row (tests, wall
# time against its budget, the runner's load) to the job summary.
#
# Nightly is the schedule below; "before a release" is this workflow run by hand with lane
# "release" (Actions tab, or `gh workflow run CI -f lane=release`).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "nightly runs every lane; release runs every lane and the history check"
        type: choice
        options: [release, nightly]
        default: release
      pythons:
        description: "all four Pythons, or 3.11 only for a quicker run"
        type: choice
        options: [all, "3.11"]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.24"
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
  OPENBLAS_NUM_THREADS: "1"
  CODE_SUITE: not math and not calibration and not backend and not slow
  FLOORS_TEST: tests/test_pf7_packaging.py::test_pf7_5_the_code_suite_passes_with_every_requirement_at_its_floor

jobs:
  code:
    name: code (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || (github.event_name == 'push' && '["3.11", "3.14"]' || (inputs.pythons == '3.11' && '["3.11"]' || '["3.11", "3.12", "3.13", "3.14"]'))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "${{ matrix.python }}" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint and types
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check src
          .venv/bin/mypy src
      - name: Code suite
        run: .venv/bin/python .github/lanes/lane.py code 300 --over 10 -q -p no:cacheprovider -n 10 -m "$CODE_SUITE" tests

  math-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      math: ${{ steps.decide.outputs.math }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - id: decide
        name: Does this pull request run the math suite?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          python .github/lanes/math_lane.py "$BASE_SHA" "$HEAD_SHA"

  math:
    needs: [math-changes]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.math-changes.outputs.math == 'true') }}
    name: math (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || (inputs.pythons == '3.11' && '["3.11"]' || '["3.11", "3.12", "3.13", "3.14"]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "${{ matrix.python }}" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Math suite
        run: .venv/bin/python .github/lanes/lane.py math 900 -q -p no:cacheprovider -n 10 -m "math or calibration" tests

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: slow (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON((inputs.pythons == '3.11' && '["3.11"]' || '["3.11", "3.12", "3.13", "3.14"]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python "${{ matrix.python }}" .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m playwright install --with-deps chromium firefox webkit
      - name: Slow suite
        run: .venv/bin/python .github/lanes/lane.py slow 900 -q -p no:cacheprovider -n 6 -m "slow and not backend" --deselect "$FLOORS_TEST" tests

  floors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m pip install --quiet "uv==$UV_VERSION"
          uv venv --quiet --python 3.11 .venv
          uv pip install --quiet --python .venv/bin/python -e ".[all,dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Floors (the code suite at -n 8, every requirement at its floor)
        run: .venv/bin/python .github/lanes/lane.py floors 900 -q -p no:cacheprovider -m "slow and not backend" --basetemp "$RUNNER_TEMP/floors" "$FLOORS_TEST"
      - name: Keep the inner run's whole output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floors-suite-output
          path: ${{ runner.temp }}/floors/**/floors-suite-output.txt
          retention-days: 30
          if-no-files-found: warn

  linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Code suite in a Debian container
        run: |
          docker info --format 'docker {{.ServerVersion}}, {{.NCPU}} cpus, {{.OperatingSystem}}'
          # As a user that is not root: chmod-based tests cannot fail as root. --init puts an init at
          # PID 1 that reaps orphaned children, as a Linux host's does; without it the Burla tests
          # that wait for an orphaned launcher to exit see a zombie that never goes.
          set +e
          docker run --rm --init -v "$PWD":/src:ro -e CODE_SUITE -e OPENBLAS_NUM_THREADS -e UV_VERSION python:3.11-bookworm bash -c '
            set -e
            pip install --quiet --root-user-action=ignore "uv==$UV_VERSION"
            useradd --create-home tester
            cp -a /src /work && chown -R tester /work
            su tester -c "cd /work && export PATH=/work/.venv/bin:\$PATH && uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e \".[all,dev]\" && .venv/bin/python .github/lanes/lane.py linux 300 -q -p no:cacheprovider -n 8 -m \"\$CODE_SUITE\" tests"' 2>&1 | tee linux.log
          status=${PIPESTATUS[0]}
          grep -E '^\|( lane | linux |---)' linux.log >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  history:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: History check
        run: python .github/lanes/history.py
